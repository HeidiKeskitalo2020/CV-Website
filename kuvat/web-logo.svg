<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 90" width="84" height="90" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Website</title>
  <g transform="translate(-4,-2)">
    <defs>
      <!-- Leikkaa maapallon viivat pois neulan kohdalta, jolloin tausta pysyy läpinäkyvänä -->
