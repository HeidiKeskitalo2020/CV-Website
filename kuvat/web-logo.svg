        <path clip-rule="evenodd" d="M-10 -10 H110 V110 H-10 Z
                 M64 61 C64 61 43 39 43 26 A21 21 0 0 1 85 26 C85 39 64 61 64 61 Z"/>
      </clipPath>
    </defs>
    <g clip-path="url(#pin-cut)" fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
      <!-- maapallon ulkoreuna -->
      <circle cx="44" cy="50" r="34" stroke-width="4"/>
      <!-- maapallon sisäviivat, kapeammat -->
      <g stroke-width="2.5">
        <ellipse cx="44" cy="50" rx="15" ry="34"/>
        <line x1="10" y1="50" x2="78" y2="50"/>
        <path d="M16 31 Q44 39 72 31"/>
        <path d="M16 69 Q44 61 72 69"/>
      </g>
    </g>
    <!-- sijaintineula, kärki osoittaa maapallon sisälle -->
    <path d="M64 54 C64 54 48 36 48 26 A16 16 0 0 1 80 26 C80 36 64 54 64 54 Z"
          fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="64" cy="26" r="5" fill="black"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
